name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# nov zagon na isti veji prekliče starejšega (deploy na main se nikoli ne prekine)
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven              # ~/.m2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm                # ~/.npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend – Checkstyle
        working-directory: backend
        run: ./mvnw -B -ntp checkstyle:check

      - name: Frontend – namestitev odvisnosti
        working-directory: frontend
        run: npm ci

      - name: Frontend – oxlint
        working-directory: frontend
        run: npm run lint

  # ---------------------------------------------------------------- build
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend – gradnja JAR
        working-directory: backend
        run: ./mvnw -B -ntp package -DskipTests

      - name: Backend – priprava paketa za namestitev
        run: |
          mkdir -p backend-dist
          cp backend/target/stocklab-*.jar backend-dist/app.jar
          cp backend/Dockerfile backend-dist/Dockerfile

      - name: Frontend – namestitev odvisnosti
        working-directory: frontend
        run: npm ci

      - name: Frontend – gradnja
        working-directory: frontend
        env:
          # vrednosti so javne (URL backenda, Supabase publishable key) -> repository variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run build
          # GitHub Pages: SPA fallback za poti kot /stocks/5 in brez Jekyll obdelave
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend-dist/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          include-hidden-files: true   # .nojekyll
          retention-days: 7

  # ---------------------------------------------------------------- test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend – testi in JaCoCo pokritost
        working-directory: backend
        run: ./mvnw -B -ntp test

      - name: Frontend – namestitev odvisnosti
        working-directory: frontend
        run: npm ci

      - name: Frontend – testi in pokritost (Vitest)
        working-directory: frontend
        run: npm run coverage

      - name: Shrani poročila o pokritosti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/target/site/jacoco/
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------- deploy
  deploy:
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    permissions:
      contents: write    # objava na vejo gh-pages
      packages: write    # objava slike v GHCR
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Prenos artefaktov iz joba build
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ---- backend: JAR iz artefakta -> slika v GHCR -> Render
      - name: Prijava v GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Zapakiraj JAR v sliko in jo objavi
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stocklab-backend"
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" artifacts/backend-jar
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          echo "ref=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Namesti backend na Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Manjka secret RENDER_DEPLOY_HOOK_URL v okolju production"
            exit 1
          fi
          IMG=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["IMAGE_REF"],safe=""))')
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMG}"

      # ---- frontend: dist iz artefakta -> GitHub Pages
      - name: Namesti frontend na GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts/frontend-dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Počakaj, da je backend dosegljiv
        env:
          BACKEND_URL: ${{ vars.VITE_API_URL }}
        run: |
          # Render potrebuje nekaj minut, da potegne sliko in zažene Spring Boot
          for i in $(seq 1 40); do
            if curl -fsS "$BACKEND_URL/api/actuator/health" | grep -q '"status":"UP"'; then
              echo "Backend je UP: $BACKEND_URL"
              exit 0
            fi
            echo "Čakam na backend ($i/40) ..."
            sleep 15
          done
          echo "::error::Backend po 10 minutah ni dosegljiv"
          exit 1
